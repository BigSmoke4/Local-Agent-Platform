name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: local_agent_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/LocalAgentPlatform.Web/LocalAgentPlatform.Web.csproj

      - name: Build
        run: dotnet build src/LocalAgentPlatform.Web/LocalAgentPlatform.Web.csproj --no-restore -c Release

      - name: Unit tests (pure Domain logic, no DB/network)
        run: dotnet test tests/LocalAgentPlatform.Domain.Tests/LocalAgentPlatform.Domain.Tests.csproj -c Release --logger "trx;LogFileName=domain-tests.trx"

      - name: Integration tests (real Postgres via the service container above)
        env:
          ConnectionStrings__PlatformDb: "Host=localhost;Port=5432;Database=local_agent_platform_test;Username=postgres;Password=postgres"
        run: dotnet test tests/LocalAgentPlatform.Integration.Tests/LocalAgentPlatform.Integration.Tests.csproj -c Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t local-agent-platform:ci .
