version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: local_agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ConnectionStrings__PlatformDb: "Host=postgres;Port=5432;Database=local_agent_platform;Username=postgres;Password=postgres"
      Ollama__BaseUrl: "http://ollama:11434"
    volumes:
      # Mount repositories you want the platform to work on here, then register
      # them (from inside the container) as e.g. /workspace/my-repo.
      - ./workspace:/workspace

volumes:
  pgdata:
  ollamadata:
